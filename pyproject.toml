[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exovision"
version = "1.0.0"
description = "Autonomous exoplanet detection from Kepler/TESS light curves"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "astropy>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9"]
science = [
    "transitleastsquares>=1.32",
    "batman-package>=2.5",
    "emcee>=3.1",
    "celerite2>=0.3",
    "corner>=2.2",
]
remote = ["lightkurve>=2.4"]

[project.scripts]
exovision = "exovision.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "api"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
